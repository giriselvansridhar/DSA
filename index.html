<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giri's DSA Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="assets/site.css">
<style>
/* Layout: problem list as the main column, a compact dashboard pinned in the right corner; stacks on phones. */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; }
@media (max-width: 920px) { .layout { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) { #q { max-width: none; flex-basis: 100%; } }
.layout > * { min-width: 0; }
.main-col { display: grid; gap: 22px; }
.sech { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.sech h2 { font-size: 18px; }

.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
#q { flex: 1; min-width: 0; max-width: 320px; font-family: var(--font-body); }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.item { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 16px; border-top: 1px solid var(--line); color: var(--ink); }
.item:first-child { border-top: 0; }
a.item:hover { background: var(--surface-2); text-decoration: none; }
.item .no { font: 12px var(--font-mono); color: var(--faint); }
.item .t { font-weight: 600; font-size: 15.5px; }
.item .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.item .right { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.item .play { font-size: 13px; font-weight: 600; color: var(--accent); white-space: nowrap; }
@media (max-width: 560px) { .item { grid-template-columns: minmax(0, 1fr); gap: 6px; } .item .no { display: none; } .item .right { justify-content: flex-start; } }
.emptyrow { padding: 18px 16px; color: var(--muted); font-size: 14px; }

.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); display: grid; gap: 12px; }
@media (max-width: 920px) { .side { position: static; } }
.mini { display: grid; gap: 14px; }
.mini h2 { font-size: 15px; }
.ring { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; align-items: center; }
.ring svg { width: 84px; height: 84px; display: block; }
.ring .big { font: 600 24px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.ring .big small { font-size: 13px; color: var(--muted); font-weight: 500; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border-radius: 10px; overflow: hidden; }
.stats div { background: var(--surface); padding: 10px 12px; }
.stats b { display: block; font: 600 18px var(--font-display); font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--muted); }
.fc { border-radius: 10px; padding: 10px 12px; font-size: 13.5px; display: grid; gap: 2px; }
.fc.ok { background: var(--good-soft); }
.fc.late { background: var(--warm-soft); }
.fc b { font-variant-numeric: tabular-nums; }
.fc .v { font-weight: 600; }
.fc.ok .v { color: var(--good); } .fc.late .v { color: var(--warm); }
.cpline { font-size: 13px; display: grid; gap: 6px; }
.meter { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.full { font-weight: 600; font-size: 13.5px; }
</style>

</head>
<body>
<header class="topbar"><div class="in">
  <a class="brand" href="index.html"><span class="mark">{ }</span>DSA Lab</a>
  <nav class="topnav"><a class="on" href="index.html">Problems</a><a href="dashboard.html">Dashboard</a></nav>
  <a class="gh" href="https://github.com/giriselvansridhar/DSA">GitHub ↗</a>
</div></header>

<main class="page">
  <div class="phead">
    <div class="eyebrow" id="today"></div>
    <h1>Problems</h1>
    <p class="lead">Every problem I've solved, replayed one line at a time. Open one and press Play.</p>
  </div>

  <div class="layout">
    <div class="main-col">
      <section>
        <div class="sech"><h2>Up next</h2><span class="muted" id="nextSub"></span></div>
        <div class="list" id="next"></div>
      </section>
      <section>
        <div class="sech"><h2>Solved</h2><span class="muted" id="solvedSub"></span></div>
        <div class="tools">
          <input id="q" type="text" placeholder="Search problems or topics" aria-label="Search problems">
          <div class="chips" id="filters"></div>
        </div>
        <div class="list" id="solved"></div>
      </section>
    </div>

    <aside class="side">
      <div class="card mini" id="mini"></div>
    </aside>
  </div>
</main>
<footer class="site" id="foot"></footer>

<script src="assets/data.js"></script>
<script>
(function () {
  const D = window.DSA;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const DAY = 864e5;
  const toD = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const key = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const short = (d) => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  const ist = new Date(Date.now() + (330 + new Date().getTimezoneOffset()) * 60000);
  const today = new Date(ist.getFullYear(), ist.getMonth(), ist.getDate());
  const daysBetween = (a, b) => Math.round((b - a) / DAY);
  const pill = (s) => `<span class="pill ${s === 'Solved alone' ? 'ok' : s === 'Needed help' ? 'help' : 'todo'}">${esc(s)}</span>`;
  const byName = Object.fromEntries(D.problems.map((p) => [p[1], p]));

  $('today').textContent = today.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  // ---------- up next: today's unfinished rows ----------
  const todo = D.log.filter((r) => r.status === 'To do');
  $('nextSub').textContent = todo.length ? `${todo.length} problem${todo.length > 1 ? 's' : ''} waiting` : '';
  $('next').innerHTML = todo.length ? todo.map((r) => {
    const p = byName[r.name];
    return `<a class="item" href="${esc(p ? p[2] : '#')}">
      <span class="no">${p ? '#' + p[0] : ''}</span>
      <div><div class="t">${esc(r.name)}</div><div class="sub">${esc(r.topic)} · ${r.type} · ${short(toD(r.date))}</div></div>
      <div class="right">${pill('To do')}<span class="play">Solve ↗</span></div></a>`;
  }).join('') : '<div class="emptyrow">Nothing waiting. Today\'s problems arrive at 7:08 AM.</div>';

  // ---------- solved list ----------
  let filter = 'All', q = '';
  const topics = ['All', ...new Set(D.players.map((p) => p.topic))];
  function renderSolved() {
    $('filters').innerHTML = topics.map((t) => `<button type="button" class="chip ${t === filter ? 'on' : ''}" data-t="${esc(t)}">${esc(t)}</button>`).join('');
    const rows = D.players.filter((p) => (filter === 'All' || p.topic === filter) &&
      (!q || `${p.name} ${p.topic} ${p.idea}`.toLowerCase().includes(q)));
    $('solved').innerHTML = rows.length ? rows.map((p) => `<a class="item" href="${p.file}">
      <span class="no">#${p.num}</span>
      <div><div class="t">${esc(p.name)}</div><div class="sub">${esc(p.topic)} · ${short(toD(p.date))} · ${esc(p.idea)}</div></div>
      <div class="right"><span class="pill med">${p.diff}</span>${pill(p.status)}<span class="play">▶ Play</span></div></a>`).join('')
      : '<div class="emptyrow">No problems match.</div>';
  }
  $('filters').onclick = (e) => { const b = e.target.closest('button'); if (b) { filter = b.dataset.t; renderSolved(); } };
  $('q').oninput = (e) => { q = e.target.value.trim().toLowerCase(); renderSolved(); };
  const alone = D.players.filter((p) => p.status === 'Solved alone').length;
  $('solvedSub').textContent = `${D.players.length} with step-by-step players · ${alone} solved alone`;
  renderSolved();

  // ---------- compact dashboard ----------
  const done = D.problems.filter((p) => p[4]).length, remaining = 150 - done;
  const newSolved = D.log.filter((r) => r.type === 'New' && /Solved|Needed/.test(r.status) && r.date > D.baseline.date).length;
  const total = D.baseline.total + newSolved;
  const active = new Set(D.log.filter((r) => /Solved|Needed/.test(r.status)).map((r) => r.date));
  let streak = 0;
  for (let d = active.has(key(today)) ? today : addDays(today, -1); active.has(key(d)); d = addDays(d, -1)) streak++;
  // finish date at the plan pace (2 new a day, 6 days a week, Sundays off)
  let left = remaining, d = new Date(today), study = 0;
  while (left > 0) { if (d.getDay() !== 0) { left -= D.plan.newPerDay; study++; } if (left > 0) d = addDays(d, 1); }
  const target = toD(D.plan.ncTarget), diff = daysBetween(d, target);
  const cp = D.checkpoints.find((c) => toD(c.date) >= today) || D.checkpoints[D.checkpoints.length - 1];
  const cpLeft = Math.max(0, daysBetween(today, toD(cp.date))), cpNeed = Math.max(0, cp.total - total);
  const R = 34, C = 2 * Math.PI * R, frac = done / 150;
  $('mini').innerHTML = `
    <div class="row between"><h2>Dashboard</h2><a class="full" href="dashboard.html">Full view →</a></div>
    <div class="ring">
      <svg viewBox="0 0 84 84" role="img" aria-label="${done} of 150 NeetCode problems done">
        <circle cx="42" cy="42" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="9"/>
        <circle cx="42" cy="42" r="${R}" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round"
          stroke-dasharray="${(C * frac).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 42 42)"/>
        <text x="42" y="47" text-anchor="middle" style="font:600 15px var(--font-display);fill:var(--ink)">${Math.round(frac * 100)}%</text>
      </svg>
      <div><div class="big">${done}<small> / 150</small></div><div class="muted">NeetCode 150 done · ${remaining} to go</div></div>
    </div>
    <div class="stats">
      <div><b>${total}</b><span>Total solved</span></div>
      <div><b>${streak}</b><span>Day streak</span></div>
      <div><b>${study}</b><span>Study days left</span></div>
      <div><b>${daysBetween(today, toD('2027-05-01'))}</b><span>Days to 1 May</span></div>
    </div>
    <div class="fc ${diff >= 0 ? 'ok' : 'late'}">
      <span>At 2 a day, 6 days a week, all 150 done by</span>
      <b style="font-size:15px">${d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' })}</b>
      <span class="v">${diff >= 0 ? `${diff} days before the 14 Mar target` : `${-diff} days after the 14 Mar target`}</span>
    </div>
    <div class="cpline">
      <div class="row between"><b>Next checkpoint</b><span class="muted">${short(toD(cp.date))} · ${cpLeft} days</span></div>
      <div class="meter"><i style="width:${Math.min(100, total / cp.total * 100).toFixed(1)}%"></i></div>
      <span class="muted">${total} / ${cp.total} solved${cpNeed ? ` · need ${cpNeed} more` : ' · reached'}</span>
    </div>`;
  $('foot').innerHTML = `Updated ${short(toD(D.updated))} ${toD(D.updated).getFullYear()} · Python 3 · <a href="https://leetcode.com/u/giriselvan1/">LeetCode profile</a>`;
})();
</script>

</body>
</html>
