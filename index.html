<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pattern Drills — Missions</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>

<style>
  :root{
    --bg:#ffffff; --panel:#f4f6f9; --panel2:#e9edf3; --line:#dce1e8;
    --text:#161a20; --muted:#5c6675; --accent:#2563eb; --accent2:#0891b2;
    --gold:#d9a406; --pass:#16a34a; --fail:#dc2626; --pass-bg:#dcfce7; --fail-bg:#fee2e2;
    --easy:#16a34a; --medium:#d97706; --codebg:#f1f3f7;
    --ptr:#db2777; --win:#0891b233; --done:#16a34a26;
  }
  html[data-theme="dark"]{
    --bg:#0a0e14; --panel:#111722; --panel2:#18202e; --line:#25303f;
    --text:#e7edf5; --muted:#8a97a8; --accent:#38bdf8; --accent2:#22d3ee;
    --gold:#fbbf24; --pass:#3fb950; --fail:#f85149; --pass-bg:#122019; --fail-bg:#2d1618;
    --easy:#3fb950; --medium:#e3b341; --codebg:#0d1420;
    --ptr:#f472b6; --win:#22d3ee2e; --done:#3fb95024;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text); overflow:hidden;
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column;
  }
  code,.mono{font-family:ui-monospace,SFMono-Regular,"Cascadia Code",Consolas,monospace}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}

  /* ---------- top bar ---------- */
  header{
    flex:0 0 auto; display:flex; align-items:center; gap:14px; height:50px;
    padding:0 16px; border-bottom:1px solid var(--line); background:var(--panel);
  }
  .brand{font-weight:800; letter-spacing:2px; font-size:13px; text-transform:uppercase; color:var(--accent2)}
  .brand b{color:var(--text)}
  header .sp{flex:1}
  .hud{display:flex; align-items:center; gap:6px; font-variant-numeric:tabular-nums; color:var(--muted); font-size:13px}
  .hud .big{color:var(--gold); font-weight:800}
  #rt{font-size:12px; color:var(--muted)}
  #rt.ok{color:var(--pass)} #rt.err{color:var(--fail)}
  header button{
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:5px; padding:6px 11px; cursor:pointer; font-size:12px; font-weight:600; letter-spacing:.3px;
  }
  header button:hover{border-color:var(--accent)}

  .layout{flex:1; display:flex; min-height:0}

  /* ---------- mission rail ---------- */
  aside{
    flex:0 0 296px; border-right:1px solid var(--line); background:var(--panel);
    overflow-y:auto; padding-bottom:24px;
  }
  .chap{
    padding:14px 14px 6px; font-size:10.5px; letter-spacing:1.4px; text-transform:uppercase;
    color:var(--muted); font-weight:800; display:flex; justify-content:space-between; align-items:baseline;
  }
  .chap .cs{color:var(--gold); letter-spacing:1px}
  .mrow{
    display:flex; align-items:center; gap:9px; padding:8px 14px; cursor:pointer;
    border-left:3px solid transparent;
  }
  .mrow:hover{background:var(--panel2)}
  .mrow.active{background:var(--panel2); border-left-color:var(--accent2)}
  .mrow .idx{
    flex:0 0 24px; height:24px; display:grid; place-items:center; font-size:11px; font-weight:800;
    background:var(--panel2); border:1px solid var(--line); transform:skewX(-8deg); color:var(--muted);
  }
  .mrow.done3 .idx{background:var(--gold); color:#1a1500; border-color:var(--gold)}
  .mrow .mt{flex:1 1 0; min-width:0; overflow:hidden}
  .mrow .mt .nm{font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .mrow .mt .st{font-size:10px; color:var(--gold); letter-spacing:1px}
  .mrow .mt .st .o{color:var(--line)}
  .pill{font-size:9px; padding:1px 6px; border-radius:999px; border:1px solid currentColor; text-transform:uppercase; letter-spacing:.5px; font-weight:700}
  .pill.easy{color:var(--easy)} .pill.medium{color:var(--medium)}

  /* ---------- main ---------- */
  main{flex:1; display:flex; flex-direction:column; min-width:0; overflow:hidden}
  .scroll{flex:1; min-height:0; overflow-y:auto; overflow-x:hidden}

  /* career landing */
  .career{padding:22px; max-width:1100px}
  .career h1{margin:0 0 4px; font-size:22px; letter-spacing:1px}
  .career .sub{color:var(--muted); margin-bottom:20px}
  .cgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px}
  .ccard{border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:14px}
  .ccard h3{margin:0 0 2px; font-size:13px; letter-spacing:.6px; text-transform:uppercase}
  .ccard .cmeta{color:var(--muted); font-size:11px; margin-bottom:10px}
  .cbar{height:6px; background:var(--panel2); border-radius:999px; overflow:hidden; margin-bottom:10px}
  .cbar i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .cchip{
    display:inline-flex; align-items:center; gap:6px; padding:5px 9px; margin:3px 4px 0 0;
    border:1px solid var(--line); border-radius:6px; cursor:pointer; font-size:11.5px;
  }
  .cchip:hover{border-color:var(--accent)}
  .cchip .s{color:var(--gold); font-size:9px; letter-spacing:1px}

  /* mission header */
  .mhead{
    flex:0 0 auto; padding:12px 18px 0; border-bottom:1px solid var(--line); background:var(--panel);
  }
  .mhead .row1{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .mhead .mno{font-weight:800; color:var(--accent2); letter-spacing:1px; font-size:12px}
  .mhead h2{margin:0; font-size:18px}
  .mhead .stars{color:var(--gold); letter-spacing:2px; font-size:14px}
  .mhead .stars .o{color:var(--line)}
  .mhead .timer{margin-left:auto; color:var(--muted); font-variant-numeric:tabular-nums; font-size:13px}
  .tabs{display:flex; gap:4px; margin-top:10px}
  .tab{
    padding:8px 14px 9px; cursor:pointer; font-size:11.5px; font-weight:700; letter-spacing:.6px;
    text-transform:uppercase; color:var(--muted); border:1px solid transparent; border-bottom:none;
    border-radius:6px 6px 0 0;
  }
  .tab:hover{color:var(--text)}
  .tab.on{color:var(--text); background:var(--bg); border-color:var(--line)}
  .tab .dot{color:var(--gold)} .tab .dot.off{color:var(--line)}

  .stage{padding:16px 18px 40px}
  h4.sec{margin:18px 0 6px; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--muted)}
  .desc code{background:var(--codebg); padding:1px 5px; border-radius:4px; font-size:12.5px}
  .desc ul{margin:6px 0; padding-left:20px}
  .ex{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:9px 11px; margin:6px 0; white-space:pre-wrap; font-size:12.5px}

  /* ---------- replay ---------- */
  .replay-grid{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:14px}
  @media(max-width:900px){ .replay-grid{grid-template-columns:1fr} }
  .rcode{border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--codebg)}
  .rcode pre{margin:0; padding:10px 0; font-size:12.5px; line-height:1.7; overflow-x:auto}
  .rcode .ln{display:block; padding:0 14px 0 46px; position:relative; white-space:pre}
  .rcode .ln::before{content:attr(data-n); position:absolute; left:0; width:36px; text-align:right; color:var(--muted); opacity:.6}
  .rcode .ln.cur{background:var(--win); box-shadow:inset 3px 0 0 var(--accent2)}
  .vizbox{border:1px solid var(--line); border-radius:8px; padding:12px; background:var(--panel); min-height:170px}
  .vizbox .cap{font-size:11px; color:var(--muted); margin-bottom:10px; min-height:16px}
  .cells{display:flex; flex-wrap:wrap; gap:4px}
  .cell{
    min-width:34px; height:38px; display:grid; place-items:center; font-size:13px; font-weight:700;
    border:1px solid var(--line); border-radius:5px; background:var(--bg); position:relative;
  }
  .cell.win{background:var(--win)} .cell.done{background:var(--done)}
  .cell .mk{
    position:absolute; top:-16px; left:50%; transform:translateX(-50%);
    font-size:9px; font-weight:800; color:var(--ptr); white-space:nowrap; letter-spacing:.5px;
  }
  .cell.hit{outline:2px solid var(--ptr); outline-offset:1px}
  .idxs{display:flex; flex-wrap:wrap; gap:4px; margin-top:3px}
  .idxs span{min-width:34px; text-align:center; font-size:9px; color:var(--muted)}
  .stat{display:inline-block; margin:8px 10px 0 0; font-size:12px}
  .stat b{color:var(--accent2)}
  .nodes{display:flex; align-items:center; flex-wrap:wrap; gap:2px; margin-top:6px}
  .node{border:1px solid var(--line); border-radius:5px; padding:6px 9px; font-weight:700; font-size:12px; background:var(--bg); position:relative}
  .node .mk{position:absolute; top:-15px; left:50%; transform:translateX(-50%); font-size:9px; font-weight:800; color:var(--ptr)}
  .arrow{color:var(--muted)}
  .stackwrap{display:flex; flex-direction:column-reverse; gap:3px; min-height:44px; align-items:flex-start}
  .sbox{border:1px solid var(--line); background:var(--bg); padding:4px 12px; border-radius:4px; font-weight:700}
  .chips span{display:inline-block; padding:3px 7px; margin:2px; border:1px solid var(--line); border-radius:5px; font-size:11px}
  .chips span.new{border-color:var(--accent2); color:var(--accent2)}
  .vtable{width:100%; border-collapse:collapse; margin-top:8px; font-size:12px}
  .vtable td{border-top:1px solid var(--line); padding:3px 8px; vertical-align:top}
  .vtable td.k{color:var(--muted); width:1%; white-space:nowrap; font-weight:700}
  .vtable td.chg{color:var(--accent2)}
  .rctrl{display:flex; align-items:center; gap:8px; margin-top:12px; flex-wrap:wrap}
  .rctrl button{background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:5px; padding:7px 12px; cursor:pointer; font-size:12px; font-weight:600}
  .rctrl button:hover{border-color:var(--accent)}
  .rctrl .pos{color:var(--muted); font-variant-numeric:tabular-nums; font-size:12px}

  /* ---------- editor / solve ---------- */
  .editorwrap{height:56vh; min-height:300px; display:flex; flex-direction:column; border:1px solid var(--line); border-radius:8px; overflow:hidden}
  .CodeMirror{height:100%; font-size:13px; font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
  textarea.fb{flex:1; width:100%; font-family:ui-monospace,monospace; font-size:13px; border:0; padding:10px; background:var(--bg); color:var(--text); resize:none}
  .actions{display:flex; align-items:center; gap:8px; padding:10px 0; flex-wrap:wrap; position:sticky; top:0; background:var(--bg); z-index:4}
  .actions button{border-radius:5px; padding:8px 15px; cursor:pointer; border:1px solid var(--line); font-size:12.5px; font-weight:700; background:var(--panel2); color:var(--text)}
  .actions .run{background:var(--pass); color:#fff; border-color:var(--pass)}
  .actions .submit{background:var(--accent); color:#fff; border-color:var(--accent)}
  .actions button:disabled{opacity:.5; cursor:default}
  .actions .hb{margin-left:auto; display:flex; gap:6px; align-items:center}
  .actions .hb span{color:var(--muted); font-size:11px}
  .rsummary{padding:8px 2px; font-weight:800; letter-spacing:.3px}
  .rsummary.pass{color:var(--pass)} .rsummary.fail{color:var(--fail)}
  .case{border:1px solid var(--line); border-left-width:4px; border-radius:6px; padding:8px 10px; margin:6px 0; font-size:12px; white-space:pre-wrap; overflow-x:auto}
  .case.pass{border-left-color:var(--pass); background:var(--pass-bg)}
  .case.fail{border-left-color:var(--fail); background:var(--fail-bg)}
  .case .b{font-weight:800}
  .case.pass .b{color:var(--pass)} .case.fail .b{color:var(--fail)}
  .errbox{border:1px solid var(--fail); border-left-width:4px; background:var(--fail-bg); border-radius:6px; padding:10px; margin:8px 0; font-size:12px; white-space:pre-wrap; color:var(--fail)}
  .hint{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px 12px; margin:6px 0}
  .hint h5{margin:0 0 4px; font-size:10.5px; letter-spacing:.8px; text-transform:uppercase; color:var(--muted)}
  .hint pre{background:var(--codebg); padding:10px; border-radius:6px; overflow-x:auto; font-size:12px; margin:6px 0 0}

  /* ---------- concept ---------- */
  .subhead{display:flex; align-items:center; gap:8px}
  .subhead .tick{color:var(--pass); font-weight:800}
  .mcq{border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin:10px 0; background:var(--panel)}
  .mcq .q{font-weight:600; margin-bottom:8px}
  .opt{display:block; padding:8px 10px; border:1px solid var(--line); border-radius:6px; margin:5px 0; cursor:pointer; font-size:13px}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--accent)}
  .opt.right{border-color:var(--pass); background:var(--pass-bg)}
  .opt.wrong{border-color:var(--fail); background:var(--fail-bg)}
  .mcq .exp{margin-top:8px; font-size:12px; color:var(--muted); display:none}
  .mcq.answered .exp{display:block}
  .parsons{display:flex; flex-direction:column; gap:5px; margin:8px 0}
  .pline{
    display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:6px;
    padding:6px 8px; background:var(--panel); cursor:grab; font-size:12.5px;
  }
  .pline.drag{opacity:.4}
  .pline.ok{border-color:var(--pass)} .pline.bad{border-color:var(--fail)}
  .pline .code{flex:1; white-space:pre; overflow-x:auto}
  .pline .mv{display:flex; flex-direction:column}
  .pline .mv button{border:1px solid var(--line); background:var(--panel2); color:var(--text); cursor:pointer; font-size:9px; line-height:1; padding:2px 4px; border-radius:3px}
  .cbtn{border-radius:5px; padding:8px 14px; cursor:pointer; border:1px solid var(--line); font-size:12.5px; font-weight:700; background:var(--panel2); color:var(--text)}
  .cbtn.go{background:var(--accent); color:#fff; border-color:var(--accent)}

  /* modal / toast / fx */
  .modal{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:50}
  .modal.show{display:flex}
  .modal .card{background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:20px; width:min(560px,92vw); max-height:80vh; overflow-y:auto}
  .modal .x{float:right; cursor:pointer; border:1px solid var(--line); background:var(--panel2); border-radius:5px; padding:3px 9px}
  .drow{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--line)}
  .drow .n{flex:1} .drow .bar{flex:0 0 130px; height:8px; background:var(--panel2); border-radius:999px; overflow:hidden}
  .drow .bar i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .drow .v{flex:0 0 52px; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums}
  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--gold); color:#1a1400; padding:11px 20px; border-radius:8px; font-weight:800; letter-spacing:.5px; opacity:0; transition:.25s; pointer-events:none; z-index:60}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .fx{position:fixed; width:9px; height:9px; z-index:59; pointer-events:none; border-radius:2px}
  @keyframes fall{to{transform:translate(var(--dx),70vh) rotate(540deg); opacity:0}}
  .empty{margin:auto; color:var(--muted); text-align:center; padding:50px}
</style>
</head>
<body>

<header>
  <span class="brand">◆ <b>PATTERN</b> DRILLS</span>
  <span class="sp"></span>
  <span class="hud" title="stars earned">★ <span class="big" id="hud-stars">0</span> / 54</span>
  <span class="hud" title="missions fully cleared">✦ <span id="hud-missions">0</span> / 18</span>
  <span id="rt">runtime idle</span>
  <button id="btn-home">Career</button>
  <button id="btn-dash">Stats</button>
  <button id="btn-theme">Light</button>
</header>

<div class="layout">
  <aside id="rail"></aside>
  <main id="main"><div class="scroll"><div class="empty">Loading missions…</div></div></main>
</div>

<div class="modal" id="modal"><div class="card"><span class="x" id="modal-x">esc</span><h2>Progress</h2><div id="dash"></div></div></div>
<div class="toast" id="toast"></div>

<!-- ===================== Pyodide code: test runner + tracer ===================== -->
<script id="py-src" type="text/plain">
import json, sys, traceback

class ListNode:
    def __init__(self, val=0, next=None):
        self.val = val
        self.next = next

def to_linked(arr):
    dummy = ListNode(); cur = dummy
    for x in arr:
        cur.next = ListNode(x); cur = cur.next
    return dummy.next

def from_linked(node):
    out = []; seen = set()
    while node is not None:
        if id(node) in seen: break
        seen.add(id(node)); out.append(node.val); node = node.next
    return out

def make_cycle(arr, pos):
    head = to_linked(arr)
    if head is None: return None
    nodes = []; cur = head
    while cur is not None:
        nodes.append(cur); cur = cur.next
    if pos is not None and 0 <= pos < len(nodes):
        nodes[-1].next = nodes[pos]
    return head

def build_args(inp, t):
    if t == "linked": return [to_linked(inp[0])] + list(inp[1:])
    if t == "cycle":  return [make_cycle(inp[0], inp[1])]
    return list(inp)

def transform_result(r, t):
    if t == "linked": return from_linked(r)
    return r

def normalize(v, c):
    if c == "sorted_list": return sorted(v)
    if c == "nested_set":  return sorted([sorted(x) for x in v])
    return v

def run_all(user_code, func_name, cases, opts):
    ns = {"ListNode": ListNode}
    try:
        exec(user_code, ns)
    except Exception:
        return {"compile_error": traceback.format_exc()}
    if func_name not in ns or not callable(ns[func_name]):
        return {"compile_error": "Function '%s' is not defined. Keep the given function name." % func_name}
    fn = ns[func_name]
    at = opts.get("arg_transform"); rt = opts.get("result_transform"); cmp = opts.get("compare")
    results = []
    for c in cases:
        inp = c["input"]; exp = c["expected"]
        try:
            args = build_args(inp, at)
            r = fn(*args)
            if cmp == "remove_duplicates":
                n = r if isinstance(r, int) else -1
                got = {"len": n, "prefix": list(args[0])[:n] if isinstance(n, int) and n > 0 else []}
                results.append({"passed": got == exp, "got": repr(got), "expected": repr(exp), "error": None})
            else:
                r = transform_result(r, rt)
                g = normalize(r, cmp); e = normalize(exp, cmp)
                results.append({"passed": g == e, "got": repr(g), "expected": repr(e), "error": None})
        except RecursionError:
            results.append({"passed": False, "got": None, "expected": repr(exp), "error": "RecursionError: maximum recursion depth exceeded"})
        except Exception:
            results.append({"passed": False, "got": None, "expected": repr(exp), "error": traceback.format_exc(limit=2)})
    return {"results": results}

# ---------- tracer for the debug replay ----------
def jsonify(v):
    if v is None or isinstance(v, (bool, int, float, str)):
        return v
    if isinstance(v, ListNode):
        return {"__list__": from_linked(v)}
    if isinstance(v, dict):
        return {str(k): jsonify(x) for k, x in list(v.items())[:60]}
    if isinstance(v, (list, tuple)):
        return [jsonify(x) for x in list(v)[:60]]
    if isinstance(v, set):
        return {"__set__": [jsonify(x) for x in list(v)[:60]]}
    try:
        return repr(v)
    except Exception:
        return "<obj>"

def node_index(head, node):
    if head is None or node is None: return -1
    cur = head; i = 0; seen = set()
    while cur is not None:
        if cur is node: return i
        if id(cur) in seen: return -1
        seen.add(id(cur)); cur = cur.next; i += 1
    return -1

def trace_solution(code, func_name, trace_input, opts):
    code = code.strip("\n")
    ns = {"ListNode": ListNode}
    exec(code, ns)
    fn = ns[func_name]
    at = opts.get("arg_transform")
    args = build_args(trace_input, at)
    head_ref = args[0] if at in ("linked", "cycle") else None
    probe = opts.get("probe", [])
    probe_index = opts.get("probe_index", {})
    steps = []
    LIMIT = 700
    def rec(frame, event, arg):
        if frame.f_code.co_filename != "<string>":
            return rec
        if event not in ("line", "return"):
            return rec
        if len(steps) >= LIMIT:
            return rec
        loc = {k: jsonify(v) for k, v in list(frame.f_locals.items())}
        pr = {n: (jsonify(frame.f_locals[n]) if n in frame.f_locals else None) for n in probe}
        pri = {}
        for n, base in probe_index.items():
            b = head_ref if base == "head" else frame.f_locals.get(base)
            pri[n] = node_index(b, frame.f_locals.get(n))
        steps.append({"line": frame.f_lineno, "event": event, "locals": loc,
                      "probe": pr, "probe_index": pri,
                      "ret": jsonify(arg) if event == "return" else None})
        return rec
    sys.settrace(rec)
    try:
        result = fn(*args)
    except Exception:
        sys.settrace(None)
        return {"error": traceback.format_exc(limit=2), "code": code, "steps": steps}
    sys.settrace(None)
    return {"steps": steps, "result": jsonify(result), "code": code}
</script>

let ready = null;
async function ensurePy(){
  if(!ready){
    ready = (async () => {
      importScripts('https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js');
      self.pyodide = await loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/' });
      self.pyodide.runPython(PY_RUNNER);
    })();
  }
  return ready;
}
self.onmessage = async (e) => {
  const m = e.data;
  if(m.type === 'init'){
    try { await ensurePy(); self.postMessage({type:'ready'}); }
    catch(err){ self.postMessage({type:'initerror', error:String(err)}); }
    return;
  }
  try{
    await ensurePy();
    const py = self.pyodide;
    if(m.type === 'run'){
      py.globals.set('A', m.code); py.globals.set('B', m.funcName);
      py.globals.set('C', JSON.stringify(m.cases)); py.globals.set('D', JSON.stringify(m.opts));
      const out = py.runPython("json.dumps(run_all(A, B, json.loads(C), json.loads(D)))");
      self.postMessage({type:'result', jobId:m.jobId, data: JSON.parse(out)});
    } else if(m.type === 'trace'){
      py.globals.set('A', m.code); py.globals.set('B', m.funcName);
      py.globals.set('C', JSON.stringify(m.input)); py.globals.set('D', JSON.stringify(m.opts));
      const out = py.runPython("json.dumps(trace_solution(A, B, json.loads(C), json.loads(D)))");
      self.postMessage({type:'result', jobId:m.jobId, data: JSON.parse(out)});
    }
  }catch(err){
    self.postMessage({type:'result', jobId:m.jobId, data:{compile_error:String(err)}});
  }
};

<script>
(function(){
  "use strict";
  var PROBLEMS = JSON.parse(document.getElementById('problems-src').textContent);
  var PY_TEXT = document.getElementById('py-src').textContent;
  var WORKER_TEXT = document.getElementById('worker-src').textContent;

  var CHAPTERS = [
    "Two-pointer (opposite ends)",
    "Two-pointer (same-direction read/write)",
    "Sliding window (fixed size)",
    "Sliding window (variable size)",
    "Hashmap, one-pass",
    "Hashmap, two-pass",
    "Hashmap, canonical-key grouping",
    "Binary search",
    "Kadane's / running-total single pass",
    "Stack",
    "Linked list — three-pointer reversal",
    "Linked list — slow/fast pointers",
    "Recursion/backtracking"
  ];
  PROBLEMS.forEach(function(p, i){ p.num = i + 1; });

  // ---------------- storage ----------------
  var mem = {};
  var store = {
    get: function(k){ try { return localStorage.getItem(k); } catch(e){ return (k in mem) ? mem[k] : null; } },
    set: function(k, v){ mem[k] = v; try { localStorage.setItem(k, v); } catch(e){} }
  };
  function stars(id){
    try { return JSON.parse(store.get('lc_stars_' + id) || '{}'); } catch(e){ return {}; }
  }
  function starCount(id){ var s = stars(id); return (s.viz?1:0) + (s.code?1:0) + (s.concept?1:0); }
  function grantStar(id, which){
    var s = stars(id);
    if(s[which]) return false;
    s[which] = true;
    store.set('lc_stars_' + id, JSON.stringify(s));
    return true;
  }
  function totalStars(){ return PROBLEMS.reduce(function(a, p){ return a + starCount(p.id); }, 0); }
  function missionsCleared(){ return PROBLEMS.filter(function(p){ return starCount(p.id) === 3; }).length; }
  var LScode = {
    get: function(id){ return store.get('lc_code_' + id); },
    set: function(id, v){ store.set('lc_code_' + id, v); }
  };
  // migrate old solved list -> code star
  (function(){
    try {
      var old = JSON.parse(store.get('lc_solved') || '[]');
      old.forEach(function(id){ grantStar(id, 'code'); });
    } catch(e){}
  })();

  // ---------------- theme ----------------
  function theme(){ return store.get('lc_theme') || 'dark'; }
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    document.getElementById('btn-theme').textContent = (t === 'dark') ? 'Light' : 'Dark';
    if(editor) editor.setOption('theme', t === 'dark' ? 'material-darker' : 'default');
    if(replayCM) replayCM = null;
  }
  document.getElementById('btn-theme').addEventListener('click', function(){
    var t = theme() === 'dark' ? 'light' : 'dark';
    store.set('lc_theme', t); applyTheme(t);
  });

  // ---------------- runtime ----------------
  var rtEl = document.getElementById('rt');
  function setRt(t, c){ rtEl.textContent = t; rtEl.className = c || ''; }

  var RT = (function(){
    var url = null;
    try {
      var src = 'const PY_RUNNER = ' + JSON.stringify(PY_TEXT) + ';\n' + WORKER_TEXT;
      url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
    } catch(e){ url = null; }
    var worker = null, pending = null, seq = 0, started = false;

    function spawn(){
      worker = new Worker(url);
      worker.onmessage = function(e){
        var m = e.data;
        if(m.type === 'ready'){ setRt('Python ready', 'ok'); return; }
        if(m.type === 'initerror'){ setRt('runtime failed', 'err'); return; }
        if(m.type === 'result' && pending && m.jobId === pending.jobId){
          clearTimeout(pending.timer);
          var p = pending; pending = null; p.resolve(m.data);
        }
      };
      worker.onerror = function(){
        if(pending){ var p = pending; pending = null; clearTimeout(p.timer);
          p.resolve({ compile_error: 'The Python runtime crashed. Check your connection and reload.' }); }
        setRt('runtime error', 'err');
      };
      worker.postMessage({ type: 'init' });
    }
    function ensure(){ if(started) return; started = true; setRt('loading Python runtime…'); spawn(); }

    function jobW(msg, timeoutMs){
      ensure();
      return new Promise(function(resolve){
        var jobId = ++seq;
        var timer = setTimeout(function(){
          try { worker.terminate(); } catch(e){}
          pending = null; setRt('loading Python runtime…'); spawn();
          resolve({ timeout: true });
        }, timeoutMs);
        pending = { jobId: jobId, resolve: resolve, timer: timer };
        msg.jobId = jobId; worker.postMessage(msg);
      });
    }

    // main-thread fallback
    var mtLoad = null, mtPy = null;
    function loadScript(u){ return new Promise(function(res, rej){ var s = document.createElement('script'); s.src = u; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
    function ensureMain(){
      if(mtLoad) return mtLoad;
      started = true; setRt('loading Python runtime…');
      mtLoad = (async function(){
        await loadScript('https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js');
        mtPy = await loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/' });
        mtPy.runPython(PY_TEXT);
        setRt('Python ready (no timeout guard)', 'ok');
      })();
      return mtLoad;
    }
    async function jobM(kind, msg){
      try {
        await ensureMain();
        mtPy.globals.set('A', msg.code); mtPy.globals.set('B', msg.funcName);
        if(kind === 'run'){
          mtPy.globals.set('C', JSON.stringify(msg.cases)); mtPy.globals.set('D', JSON.stringify(msg.opts));
          return JSON.parse(mtPy.runPython("json.dumps(run_all(A, B, json.loads(C), json.loads(D)))"));
        } else {
          mtPy.globals.set('C', JSON.stringify(msg.input)); mtPy.globals.set('D', JSON.stringify(msg.opts));
          return JSON.parse(mtPy.runPython("json.dumps(trace_solution(A, B, json.loads(C), json.loads(D)))"));
        }
      } catch(err){ return { compile_error: String(err) }; }
    }

    var useWorker = !!url;
    return {
      warm: function(){ useWorker ? ensure() : ensureMain(); },
      run: function(code, funcName, cases, opts){
        var msg = { type: 'run', code: code, funcName: funcName, cases: cases, opts: opts || {} };
        return useWorker ? jobW(msg, 9000) : jobM('run', msg);
      },
      trace: function(code, funcName, input, opts){
        var msg = { type: 'trace', code: code, funcName: funcName, input: input, opts: opts || {} };
        return useWorker ? jobW(msg, 12000) : jobM('trace', msg);
      }
    };
  })();

  // ---------------- helpers ----------------
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function el(html){ var d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; }
  function chapterProblems(ch){ return PROBLEMS.filter(function(p){ return p.chapter === ch; }); }
  function starRow(id){
    var n = starCount(id), out = '';
    for(var i = 0; i < 3; i++) out += (i < n) ? '★' : '<span class="o">★</span>';
    return out;
  }

  // ---------------- rail ----------------
  var currentId = null;
  function renderRail(){

      list.forEach(function(p){
        html += '<div class="mrow ' + (starCount(p.id) === 3 ? 'done3 ' : '') + (p.id === currentId ? 'active' : '') + '" data-id="' + p.id + '">' +
          '<span class="idx">' + p.num + '</span>' +
          '<span class="mt"><span class="nm">' + esc(p.title) + '</span>' +

  }

  // ---------------- career landing ----------------
  function renderCareer(){

    stopTimers();

  }
  document.getElementById('btn-home').addEventListener('click', renderCareer);

  // ---------------- mission shell ----------------
  var editor = null, replayCM = null, saveT = null;
  var timerInt = null, timerStart = 0, playInt = null;
  function stopTimers(){ clearInterval(timerInt); clearInterval(playInt); playInt = null; }

  var activeStage = 'replay';
  function openMission(id, stage){
    var p = PROBLEMS.find(function(x){ return x.id === id; });
    if(!p) return;
    var switching = (id !== currentId);
    currentId = id;
    activeStage = stage || (switching ? 'replay' : activeStage);
    RT.warm();
    stopTimers();

    var m = document.getElementById('main');
    m.innerHTML =
      '<div class="mhead">' +
        '<div class="row1">' +
          '<span class="mno">MISSION ' + String(p.num).padStart(2, '0') + '</span>' +
          '<h2>' + esc(p.title) + '</h2>' +
          '<span class="pill ' + p.difficulty.toLowerCase() + '">' + p.difficulty + '</span>' +
          '<span class="stars" id="mstars">' + starRow(p.id) + '</span>' +
          '<span class="timer" id="mtimer">00:00</span>' +
        '</div>' +
        '<div class="tabs" id="tabs">' +
          tabBtn('replay', '1 · Replay', stars(p.id).viz) +
          tabBtn('solve', '2 · Solve', stars(p.id).code) +
          tabBtn('concept', '3 · Concept', stars(p.id).concept) +
        '</div>' +
      '</div>' +
      '<div class="scroll" id="stageScroll"><div class="stage" id="stage"></div></div>';

    document.querySelector('#tabs').addEventListener('click', function(e){
      var t = e.target.closest('.tab'); if(!t) return;
      activeStage = t.getAttribute('data-stage'); paintTabs(); renderStage(p);
    });

    if(switching || !timerStart) timerStart = Date.now();
    timerInt = setInterval(function(){
      var s = Math.floor((Date.now() - timerStart) / 1000);
      var e = document.getElementById('mtimer');
      if(e) e.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    }, 1000);

    paintTabs();
    renderStage(p);
    renderRail();
  }
  function tabBtn(stage, label, done){
    return '<div class="tab" data-stage="' + stage + '"><span class="dot' + (done ? '' : ' off') + '">●</span> ' + label + '</div>';
  }
  function paintTabs(){
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(t){
      t.classList.toggle('on', t.getAttribute('data-stage') === activeStage);
    });
  }
  function refreshStars(p){
    var e = document.getElementById('mstars'); if(e) e.innerHTML = starRow(p.id);
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(t){
      var st = t.getAttribute('data-stage');
      var done = st === 'replay' ? stars(p.id).viz : st === 'solve' ? stars(p.id).code : stars(p.id).concept;
      var d = t.querySelector('.dot'); if(d) d.className = 'dot' + (done ? '' : ' off');
    });
    renderRail();
  }

  function renderStage(p){
    var s = document.getElementById('stage');
    if(activeStage === 'replay') return renderReplay(p, s);
    if(activeStage === 'solve') return renderSolve(p, s);
    return renderConcept(p, s);
  }

  // ================= STAGE 1: REPLAY =================
  var trace = { steps: [], idx: 0, code: '', p: null };
  function renderReplay(p, host){
    editor = null;
    host.innerHTML =
      '<div class="desc">' + p.desc + '</div>' +
      '<h4 class="sec">Debug replay — the reference solution, one step at a time</h4>' +
      '<div class="replay-grid">' +
        '<div class="rcode" id="rcode"><pre>loading trace…</pre></div>' +
        '<div class="vizbox"><div class="cap" id="vcap"></div><div id="vbody"></div>' +
          '<table class="vtable" id="vtab"></table></div>' +
      '</div>' +
      '<div class="rctrl">' +
        '<button id="r-reset">⏮ Reset</button>' +
        '<button id="r-back">◀ Step</button>' +
        '<button id="r-fwd">Step ▶</button>' +
        '<button id="r-play">▶ Play</button>' +
        '<span class="pos" id="r-pos"></span>' +
      '</div>' +
      '<p style="color:var(--muted);font-size:12px;margin-top:10px">Step to the end to earn the <b>Replay</b> star. Then open <b>2 · Solve</b> and write it yourself.</p>';

    if(trace.p === p.id && trace.steps.length){ paintReplay(p); wireReplay(p); return; }

    var t = p.trace || {};
    var opts = Object.assign({}, p.opts || {}, t.opts || {});
    var code = t.code || p.hints[2];
    RT.trace(code, p.func, t.input || (p.tests[0] && p.tests[0].input) || [], opts).then(function(res){
      if(currentId !== p.id || activeStage !== 'replay') return;
      if(res.timeout || res.compile_error || res.error){
        document.getElementById('rcode').innerHTML = '<pre>' + esc((res.error || res.compile_error || 'trace timed out')) + '</pre>';
        return;
      }
      trace = { steps: res.steps || [], idx: 0, code: res.code || code, p: p.id };
      paintReplay(p); wireReplay(p);
    });
  }
  function wireReplay(p){
    document.getElementById('r-reset').onclick = function(){ trace.idx = 0; stopPlay(); paintReplay(p); };
    document.getElementById('r-back').onclick = function(){ trace.idx = Math.max(0, trace.idx - 1); stopPlay(); paintReplay(p); };
    document.getElementById('r-fwd').onclick = function(){ stepFwd(p); };
    document.getElementById('r-play').onclick = function(){ togglePlay(p); };
  }
  function stopPlay(){ if(playInt){ clearInterval(playInt); playInt = null; var b = document.getElementById('r-play'); if(b) b.textContent = '▶ Play'; } }
  function togglePlay(p){
    if(playInt){ stopPlay(); return; }
    var b = document.getElementById('r-play'); if(b) b.textContent = '⏸ Pause';
    playInt = setInterval(function(){
      if(trace.idx >= trace.steps.length - 1){ stepFwd(p); stopPlay(); return; }
      stepFwd(p);
    }, 750);
  }
  function stepFwd(p){
    if(trace.idx < trace.steps.length - 1){ trace.idx++; paintReplay(p); }
    if(trace.idx >= trace.steps.length - 1){
      if(grantStar(p.id, 'viz')){ celebrate('★ REPLAY STAR'); refreshStars(p); }
    }
  }
  function paintReplay(p){
    var steps = trace.steps, i = trace.idx, step = steps[i] || { locals: {} }, prev = steps[i - 1] || null;
    // code
    var lines = trace.code.split('\n');
    var codeHtml = lines.map(function(ln, k){
      return '<span class="ln' + (step.line === k + 1 ? ' cur' : '') + '" data-n="' + (k + 1) + '">' + (esc(ln) || ' ') + '</span>';
    }).join('');
    document.getElementById('rcode').innerHTML = '<pre>' + codeHtml + '</pre>';
    document.getElementById('r-pos').textContent = 'step ' + (i + 1) + ' / ' + steps.length +
      (step.event === 'return' ? '  · returns ' + fmtVal(step.ret) : '');
    // caption: changed vars
    var changed = [];
    var cur = step.locals || {}, pl = prev ? (prev.locals || {}) : {};
    Object.keys(cur).forEach(function(k){
      if(isNoise(cur[k])) return;
      if(JSON.stringify(cur[k]) !== JSON.stringify(pl[k])) changed.push(k + ' = ' + fmtVal(cur[k]));
    });
    document.getElementById('vcap').textContent = 'line ' + step.line + (changed.length ? '  ·  ' + changed.join('   ') : '');
    // viz
    var cfg = (p.trace && p.trace.viz) || { kind: 'none' };
    document.getElementById('vbody').innerHTML = renderViz(cfg, step, prev, p);
    // var table
    var rows = Object.keys(cur).filter(function(k){
      if(isNoise(cur[k])) return false;
      return k !== 'nums' || cfg.kind !== 'array';
    }).map(function(k){
      var chg = JSON.stringify(cur[k]) !== JSON.stringify(pl[k]);
      return '<tr><td class="k">' + esc(k) + '</td><td class="' + (chg ? 'chg' : '') + '">' + esc(fmtVal(cur[k])) + '</td></tr>';
    }).join('');
    document.getElementById('vtab').innerHTML = rows;
    var last = i >= steps.length - 1;
    var rb = document.getElementById('r-fwd'); if(rb) rb.disabled = last && false;
  }

  function fmtVal(v){
    if(v === null || v === undefined) return 'None';
    if(typeof v === 'boolean') return v ? 'True' : 'False';
    if(typeof v === 'number' || typeof v === 'string') return typeof v === 'string' ? JSON.stringify(v) : String(v);
    if(Array.isArray(v)) return '[' + v.map(fmtVal).join(', ') + ']';
    if(v.__list__) return v.__list__.length ? v.__list__.join(' → ') : '∅';
    if(v.__set__) return '{' + v.__set__.map(fmtVal).join(', ') + '}';
    if(typeof v === 'object'){
      var ks = Object.keys(v);
      return '{' + ks.slice(0, 8).map(function(k){ return k + ': ' + fmtVal(v[k]); }).join(', ') + (ks.length > 8 ? ', …' : '') + '}';
    }
    return String(v);
  }
  function toArr(raw){
    if(typeof raw === 'string') return raw.split('');
    if(Array.isArray(raw)) return raw;
    if(raw && raw.__list__) return raw.__list__;
    return null;
  }
  function isNum(x){ return typeof x === 'number'; }
  function isNoise(v){ return typeof v === 'string' && v.charAt(0) === '<' && v.indexOf('function') > -1; }

  function renderViz(cfg, step, prev, p){
    var L = step.locals || {};
    try {
      if(cfg.kind === 'array') return vizArray(cfg, L);
      if(cfg.kind === 'hash') return vizHash(cfg, L, prev);
      if(cfg.kind === 'stack') return vizStack(cfg, L);
      if(cfg.kind === 'llrev') return vizLLRev(step);
      if(cfg.kind === 'llptr') return vizLLPtr(cfg, step, p);
      if(cfg.kind === 'tree') return vizTree(L, prev);
    } catch(e){ return '<div style="color:var(--muted)">(no visual for this step)</div>'; }
    return '<div style="color:var(--muted)">Variables →</div>';
  }
  function cellsHtml(arr, shade, marks, hit){
    var c = arr.map(function(v, k){
      var mk = (marks[k] || []).join(' ');
      return '<div class="cell ' + (shade[k] || '') + (hit === k ? ' hit' : '') + '">' +
        (mk ? '<span class="mk">' + esc(mk) + '</span>' : '') + esc(String(v)) + '</div>';
    }).join('');
    var idx = arr.map(function(_, k){ return '<span>' + k + '</span>'; }).join('');
    return '<div class="cells">' + c + '</div><div class="idxs">' + idx + '</div>';
  }
  function vizArray(cfg, L){
    var arr = toArr(L[cfg.arr]); if(!arr) return '<div style="color:var(--muted)">waiting for ' + esc(cfg.arr) + '…</div>';
    var shade = {}, marks = {};
    if(cfg.win){ var lo = L[cfg.win.lo], hi = L[cfg.win.hi];
      if(isNum(lo) && isNum(hi)) for(var k = lo; k <= hi; k++) shade[k] = 'win'; }
    if(cfg.shadeTo != null && isNum(L[cfg.shadeTo])) for(var k = 0; k < L[cfg.shadeTo]; k++) shade[k] = 'done';
    if(cfg.slideEnd != null){
      var e = L[cfg.slideEnd], kk = L[cfg.klen];
      if(isNum(e) && isNum(kk)) for(var k = e - kk + 1; k <= e; k++){ if(k >= 0) shade[k] = 'win'; }
      else if(isNum(kk)) for(var k = 0; k < kk; k++) shade[k] = 'win';
    }
    if(cfg.ptr) Object.keys(cfg.ptr).forEach(function(name){ var v = L[cfg.ptr[name]]; if(isNum(v)) (marks[v] = marks[v] || []).push(name); });
    var hit = null;
    if(cfg.slidePos != null && isNum(L[cfg.slidePos])){ hit = L[cfg.slidePos]; (marks[hit] = marks[hit] || []).push('i'); }
    var html = cellsHtml(arr, shade, marks, hit);
    var stats = (cfg.stats || []).filter(function(s){ return s in L; }).map(function(s){
      return '<span class="stat">' + esc(s) + ' = <b>' + esc(fmtVal(L[s])) + '</b></span>';
    }).join('');
    if(cfg.dict && L[cfg.dict]) stats += '<span class="stat">' + esc(cfg.dict) + ': ' + esc(fmtVal(L[cfg.dict])) + '</span>';
    return html + (stats ? '<div>' + stats + '</div>' : '');
  }
  function vizHash(cfg, L, prev){
    var arr = toArr(L[cfg.arr]) || [];
    var pos = (cfg.pos != null && isNum(L[cfg.pos])) ? L[cfg.pos] : null;
    var marks = {}; if(pos != null) marks[pos] = ['i'];
    var head = cellsHtml(arr, {}, marks, pos);
    var d = L[cfg.dict];
    var body = '';
    if(d && d.__set__){
      body = '<div class="chips">' + d.__set__.map(function(v){ return '<span>' + esc(fmtVal(v)) + '</span>'; }).join('') + '</div>';
    } else if(d && typeof d === 'object'){
      var pd = prev ? (prev.locals || {})[cfg.dict] : null;
      body = '<table class="vtable">' + Object.keys(d).map(function(k){
        var isNew = !pd || JSON.stringify(pd[k]) !== JSON.stringify(d[k]);
        return '<tr><td class="k">' + esc(k) + '</td><td class="' + (isNew ? 'chg' : '') + '">' + esc(fmtVal(d[k])) + '</td></tr>';
      }).join('') + '</table>';
    } else {
      body = '<div style="color:var(--muted)">' + esc(cfg.dict) + ' = {}</div>';
    }
    return head + '<h4 class="sec" style="margin:10px 0 4px">' + esc(cfg.dict) + '</h4>' + body;
  }
  function vizStack(cfg, L){
    var arr = toArr(L[cfg.arr]) || [];
    var pos = (cfg.pos != null && isNum(L[cfg.pos])) ? L[cfg.pos] : null;
    var marks = {}; if(pos != null) marks[pos] = ['i'];
    var head = cellsHtml(arr, {}, marks, pos);
    var st = toArr(L[cfg.stack]) || [];
    var boxes = st.map(function(v){ return '<div class="sbox">' + esc(String(v)) + '</div>'; }).join('') || '<div style="color:var(--muted)">empty</div>';
    return head + '<h4 class="sec" style="margin:10px 0 4px">stack (top on the right… shown bottom-up)</h4><div class="stackwrap">' + boxes + '</div>';
  }
  function chain(list, sep){
    if(!list || !list.length) return '<span class="arrow">∅</span>';
    return list.map(function(v){ return '<span class="node">' + esc(String(v)) + '</span>'; }).join('<span class="arrow"> ' + (sep || '→') + ' </span>');
  }
  function vizLLRev(step){
    var pr = step.probe || {};
    var prev = pr.prev && pr.prev.__list__ ? pr.prev.__list__ : [];
    var cur = pr.cur && pr.cur.__list__ ? pr.cur.__list__ : [];
    var nxt = pr.nxt && pr.nxt.__list__ ? pr.nxt.__list__ : [];
    return '<div><b>prev</b> — reversed so far<div class="nodes">' + chain(prev.slice().reverse(), '←') + '</div></div>' +
      '<div style="margin-top:10px"><b>cur</b> — node being flipped, then the rest<div class="nodes">' + chain(cur, '→') + '</div></div>' +
      '<div style="margin-top:10px"><b>nxt</b> — saved next<div class="nodes">' + chain(nxt.slice(0, 1), '→') + '</div></div>';
  }
  function vizLLPtr(cfg, step, p){
    var input = (p.trace && p.trace.input) || [];
    var list = input[0] || [];
    var pos = cfg.cycle ? (input[1] != null ? input[1] : -1) : -1;
    var pi = step.probe_index || {};
    var slow = pi.slow, fast = pi.fast;
    var nodes = list.map(function(v, k){
      var mk = [];
      if(slow === k) mk.push('slow');
      if(fast === k) mk.push('fast');
      return '<span class="node">' + (mk.length ? '<span class="mk">' + mk.join('/') + '</span>' : '') + esc(String(v)) + '</span>';
    }).join('<span class="arrow"> → </span>');
    var tail = '';
    if(pos >= 0) tail = '<div style="color:var(--ptr);font-size:11px;margin-top:8px">⟲ tail.next wired back to index ' + pos + ' (value ' + esc(String(list[pos])) + ')</div>';
    var park = '';
    if(slow === -1 || fast === -1) park = '<div style="color:var(--muted);font-size:11px;margin-top:6px">a pointer at ∅ = past the end (no cycle)</div>';
    return '<div class="nodes">' + nodes + '</div>' + tail + park;
  }
  function vizTree(L, prev){
    var path = Array.isArray(L.path) ? L.path : [];
    var result = Array.isArray(L.result) ? L.result : [];
    var pr = prev ? (prev.locals || {}).result : null;
    var prn = Array.isArray(pr) ? pr.length : 0;
    var pathChips = '<div class="chips">' + (path.length ? path.map(function(v){ return '<span>' + esc(String(v)) + '</span>'; }).join('') : '<span class="arrow">[] (empty subset)</span>') + '</div>';
    var coll = '<div class="chips">' + result.map(function(sub, k){
      return '<span class="' + (k >= prn ? 'new' : '') + '">[' + sub.map(String).join(',') + ']</span>';
    }).join('') + '</div>';
    return '<div><b>current path</b> (depth ' + path.length + ')</div>' + pathChips +
      '<h4 class="sec" style="margin:10px 0 4px">collected subsets (' + result.length + ')</h4>' + coll;
  }

  // ================= STAGE 2: SOLVE =================
  function renderSolve(p, host){
    host.innerHTML =
      '<div class="desc">' + p.desc + '</div>' +
      '<h4 class="sec">Examples</h4>' +
      p.examples.map(function(e){ return '<div class="ex">Input:  ' + esc(e.i) + '\nOutput: ' + esc(e.o) + '</div>'; }).join('') +
      '<h4 class="sec">Your solution</h4>' +
      '<div class="editorwrap"><textarea id="ed" class="fb"></textarea></div>' +
      '<div class="actions">' +
        '<button class="run" id="b-run">Run sample tests</button>' +
        '<button class="submit" id="b-submit">Submit</button>' +
        '<button id="b-reset">Reset</button>' +
        '<div class="hb"><span id="h-label"></span><button id="b-hint">Reveal hint</button></div>' +
      '</div>' +
      '<div id="hintarea"></div>' +
      '<div id="results"></div>';

    var saved = LScode.get(p.id);
    var initial = (saved !== null && saved !== undefined) ? saved : p.starter;
    var ta = document.getElementById('ed'); ta.value = initial;
    if(window.CodeMirror){
      editor = CodeMirror.fromTextArea(ta, {
        mode: 'python', lineNumbers: true, indentUnit: 4, tabSize: 4,
        matchBrackets: true, autoCloseBrackets: true, styleActiveLine: true,
        theme: theme() === 'dark' ? 'material-darker' : 'default'
      });
      editor.setSize('100%', '100%');
      editor.on('change', function(){ clearTimeout(saveT); saveT = setTimeout(function(){ LScode.set(p.id, editor.getValue()); }, 400); });
      setTimeout(function(){ editor.refresh(); }, 40);
    } else {
      editor = null;
      ta.addEventListener('input', function(){ clearTimeout(saveT); saveT = setTimeout(function(){ LScode.set(p.id, ta.value); }, 400); });
    }

    var hintLevel = 0;
    document.getElementById('b-hint').onclick = function(){
      if(hintLevel >= 3) return;
      hintLevel++;
      var titles = ['pattern', 'approach', 'reference solution'];
      var body = hintLevel < 3
        ? '<div>' + esc(p.hints[hintLevel - 1]) + '</div>'
        : '<pre>' + esc(p.hints[2]) + '</pre>';
      document.getElementById('hintarea').insertAdjacentHTML('beforeend',
        '<div class="hint"><h5>Hint ' + hintLevel + ' · ' + titles[hintLevel - 1] + '</h5>' + body + '</div>');
      var b = document.getElementById('b-hint'), lab = document.getElementById('h-label');
      if(hintLevel === 1){ b.textContent = 'Reveal approach'; lab.textContent = '1 / 3'; }
      else if(hintLevel === 2){ b.textContent = 'Reveal solution'; lab.textContent = '2 / 3'; }
      else { b.disabled = true; lab.textContent = '3 / 3'; }
    };
    document.getElementById('b-reset').onclick = function(){
      if(!confirm('Reset code to the starter stub?')) return;
      if(editor) editor.setValue(p.starter); else document.getElementById('ed').value = p.starter;
      LScode.set(p.id, p.starter);
    };
    document.getElementById('b-run').onclick = function(){ execute(p, false); };
    document.getElementById('b-submit').onclick = function(){ execute(p, true); };
  }
  function getCode(){ return editor ? editor.getValue() : (document.getElementById('ed') || {}).value || ''; }

  function execute(p, isSubmit){
    var code = getCode(); LScode.set(p.id, code);
    var cases = isSubmit ? p.tests : p.tests.slice(0, p.visible);
    var rb = document.getElementById('b-run'), sb = document.getElementById('b-submit');
    rb.disabled = sb.disabled = true;
    var res = document.getElementById('results');
    res.innerHTML = '<div class="rsummary">' + (isSubmit ? 'Submitting…' : 'Running…') +
      ' <span style="color:var(--muted);font-weight:400">(first run loads Python, ~10–20s)</span></div>';
    try { document.querySelector('.actions').scrollIntoView({ block: 'start' }); } catch(e){}
    RT.run(code, p.func, cases, p.opts || {}).then(function(r){
      rb.disabled = sb.disabled = false;
      renderResults(p, r, isSubmit, cases);
    });
  }
  function renderResults(p, res, isSubmit, cases){
    var host = document.getElementById('results');
    if(res.timeout){ host.innerHTML = '<div class="errbox">Timed out after ~9s — likely an infinite loop. The runtime was restarted.</div>'; return; }
    if(res.compile_error){ host.innerHTML = '<div class="rsummary fail">Error</div><div class="errbox">' + esc(trim(res.compile_error)) + '</div>'; return; }
    var rs = res.results || [], passed = rs.filter(function(r){ return r.passed; }).length;
    var all = passed === rs.length && rs.length > 0;
    var html = '<div class="rsummary ' + (all ? 'pass' : 'fail') + '">' + (isSubmit ? 'Submit: ' : 'Run: ') +
      passed + ' / ' + rs.length + ' passed' + (isSubmit && all ? '  —  Solve star earned ★' : '') + '</div>';
    rs.forEach(function(r, i){
      var c = cases[i];
      html += '<div class="case ' + (r.passed ? 'pass' : 'fail') + '"><span class="b">' + (r.passed ? 'PASS' : 'FAIL') +
        '</span>  Case ' + (i + 1) + '<div>Input:    ' + esc(fmtInput(p, c.input)) + '</div>';
      if(r.error) html += '<div>Error:    ' + esc(trim(r.error)) + '</div>';
      else html += '<div>Expected: ' + esc(r.expected) + '</div><div>Got:      ' + esc(r.got) + '</div>';
      html += '</div>';
    });
    host.innerHTML = html;
    if(isSubmit && all){
      if(grantStar(p.id, 'code')){ celebrate('★ SOLVE STAR'); }
      refreshStars(p);
    }
  }
  function fmtInput(p, input){
    var t = (p.opts || {}).arg_transform;
    if(t === 'cycle') return 'head=' + JSON.stringify(input[0]) + ', pos=' + input[1];
    return input.map(function(x){ return JSON.stringify(x); }).join(', ');
  }
  function trim(s){ s = String(s); return (s.length > 1200 ? s.slice(-1200) : s).trim(); }

  // ================= STAGE 3: CONCEPT =================
  function renderConcept(p, host){
    editor = null;
    var mcqHtml = p.mcqs.map(function(m, qi){
      var order = shuffled(m.options.length);
      conceptState.order[qi] = order;
      var opts = order.map(function(oi){
        return '<label class="opt" data-qi="' + qi + '" data-oi="' + oi + '">' + esc(m.options[oi]) + '</label>';
      }).join('');
      return '<div class="mcq" data-qi="' + qi + '"><div class="q">' + (qi + 1) + '. ' + esc(m.q) + '</div>' +
        opts + '<div class="exp">' + esc(m.explain) + '</div></div>';
    }).join('');

    var ref = p.hints[2].split('\n').filter(function(l){ return l.length; });
    conceptState.ref = ref;
    var order = shuffled(ref.length);
    while(order.every(function(v, i){ return v === i; })) order = shuffled(ref.length);
    conceptState.plines = order.map(function(i){ return ref[i]; });

    host.innerHTML =
      '<h4 class="sec">Concept refresher — MCQs</h4>' +
      '<div style="color:var(--muted);font-size:12px;margin-bottom:6px">Answer all correctly, then reorder the code below. Both parts done → <b>Concept</b> star.</div>' +
      mcqHtml +
      '<h4 class="sec">Reassemble the reference solution</h4>' +
      '<div style="color:var(--muted);font-size:12px;margin-bottom:6px">Drag rows, or use ▲▼, until the lines are in the right order (indentation counts).</div>' +
      '<div class="parsons" id="parsons"></div>' +
      '<button class="cbtn go" id="p-check" style="margin-top:8px">Check order</button> ' +
      '<button class="cbtn" id="p-shuffle" style="margin-top:8px">Shuffle</button>' +
      '<div id="c-status" style="margin-top:10px;font-weight:700"></div>';

    Array.prototype.forEach.call(host.querySelectorAll('.opt'), function(o){
      o.addEventListener('click', function(){
        var qi = +o.getAttribute('data-qi'), oi = +o.getAttribute('data-oi');
        var mcq = host.querySelector('.mcq[data-qi="' + qi + '"]');
        if(mcq.classList.contains('answered')) return;
        mcq.classList.add('answered');
        conceptState.answers[qi] = oi;
        Array.prototype.forEach.call(mcq.querySelectorAll('.opt'), function(x){
          var xi = +x.getAttribute('data-oi');
          if(xi === p.mcqs[qi].correct) x.classList.add('right');
          else if(xi === oi) x.classList.add('wrong');
        });
        maybeConceptStar(p);
      });
    });
    renderParsons();
    document.getElementById('p-check').onclick = function(){ checkParsons(p); };
    document.getElementById('p-shuffle').onclick = function(){
      conceptState.plines = shuffled(conceptState.ref.length).map(function(i){ return conceptState.ref[i]; });
      renderParsons();
    };
  }
  var conceptState = { answers: {}, order: {}, ref: [], plines: [], parsonsOk: false };

  function shuffled(n){
    var a = []; for(var i = 0; i < n; i++) a.push(i);
    for(var i = n - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function renderParsons(){
    var host = document.getElementById('parsons');
    host.innerHTML = conceptState.plines.map(function(line, i){
      return '<div class="pline" draggable="true" data-i="' + i + '">' +
        '<span class="mv"><button data-dir="-1">▲</button><button data-dir="1">▼</button></span>' +
        '<span class="code">' + (esc(line) || ' ') + '</span></div>';
    }).join('');
    var dragI = null;
    Array.prototype.forEach.call(host.querySelectorAll('.pline'), function(row){
      row.addEventListener('dragstart', function(){ dragI = +row.getAttribute('data-i'); row.classList.add('drag'); });
      row.addEventListener('dragend', function(){ row.classList.remove('drag'); });
      row.addEventListener('dragover', function(e){ e.preventDefault(); });
      row.addEventListener('drop', function(e){
        e.preventDefault();
        var to = +row.getAttribute('data-i');
        if(dragI === null || dragI === to) return;
        var arr = conceptState.plines, item = arr.splice(dragI, 1)[0];
        arr.splice(to, 0, item);
        renderParsons();
      });
      Array.prototype.forEach.call(row.querySelectorAll('.mv button'), function(b){
        b.addEventListener('click', function(){
          var i = +row.getAttribute('data-i'), dir = +b.getAttribute('data-dir'), j = i + dir;
          var arr = conceptState.plines;
          if(j < 0 || j >= arr.length) return;
          var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
          renderParsons();
        });
      });
    });
  }
  function checkParsons(p){
    var target = conceptState.ref.join('\n');
    var got = conceptState.plines.join('\n');
    var rows = document.querySelectorAll('#parsons .pline');
    conceptState.plines.forEach(function(line, i){
      var okHere = line === conceptState.ref[i];
      rows[i].classList.toggle('ok', okHere);
      rows[i].classList.toggle('bad', !okHere);
    });
    conceptState.parsonsOk = (got === target);
    document.getElementById('c-status').textContent = conceptState.parsonsOk ? 'Order correct ✓' : 'Not quite — keep adjusting.';
    document.getElementById('c-status').style.color = conceptState.parsonsOk ? 'var(--pass)' : 'var(--fail)';
    maybeConceptStar(p);
  }
  function maybeConceptStar(p){
    var allMcq = p.mcqs.every(function(m, qi){ return conceptState.answers[qi] === m.correct; });
    if(allMcq && conceptState.parsonsOk){
      if(grantStar(p.id, 'concept')){ celebrate('★ CONCEPT STAR'); refreshStars(p); }
      var st = document.getElementById('c-status');
      if(st){ st.textContent = 'Concept star earned ★ — mission ' + (starCount(p.id) === 3 ? 'CLEARED ✦' : 'progress saved'); st.style.color = 'var(--gold)'; }
    }
  }

  // ---------------- dashboard ----------------
  var modal = document.getElementById('modal');
  document.getElementById('btn-dash').addEventListener('click', function(){ renderDash(); modal.classList.add('show'); });
  document.getElementById('modal-x').addEventListener('click', function(){ modal.classList.remove('show'); });
  modal.addEventListener('click', function(e){ if(e.target === modal) modal.classList.remove('show'); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') modal.classList.remove('show'); });
  function renderDash(){
    var rows = '<div class="drow"><span class="n"><b>Total stars</b></span><span class="bar"><i style="width:' + (100 * totalStars() / 54) + '%"></i></span><span class="v">' + totalStars() + '/54</span></div>' +
      '<div class="drow"><span class="n"><b>Missions cleared</b></span><span class="bar"><i style="width:' + (100 * missionsCleared() / 18) + '%"></i></span><span class="v">' + missionsCleared() + '/18</span></div>';
    CHAPTERS.forEach(function(ch, ci){
      var list = chapterProblems(ch);
      var got = list.reduce(function(a, x){ return a + starCount(x.id); }, 0);
      var max = list.length * 3;
      rows += '<div class="drow"><span class="n">Ch ' + (ci + 1) + ' · ' + esc(ch) + '</span><span class="bar"><i style="width:' + (100 * got / max) + '%"></i></span><span class="v">' + got + '/' + max + '</span></div>';
    });
    document.getElementById('dash').innerHTML = rows;
  }

  // ---------------- fx ----------------
  var toastEl = document.getElementById('toast'), toastT = null;
  function celebrate(msg){
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.classList.remove('show'); }, 2000);
    for(var i = 0; i < 16; i++){
      var d = document.createElement('div');
      d.className = 'fx';
      d.style.left = (46 + Math.random() * 8) + 'vw';
      d.style.top = '40vh';
      d.style.background = ['#fbbf24', '#38bdf8', '#f472b6', '#3fb950'][i % 4];
      d.style.setProperty('--dx', (Math.random() * 40 - 20) + 'vw');
      d.style.animation = 'fall ' + (0.9 + Math.random() * 0.6) + 's ease-in forwards';
      document.body.appendChild(d);
      setTimeout((function(n){ return function(){ n.remove(); }; })(d), 1600);
    }
  }

  // ---------------- boot ----------------
  applyTheme(theme());
  window.addEventListener('load', function(){ applyTheme(theme()); renderCareer(); });
  renderCareer();
})();
</script>
</body>
</html>
